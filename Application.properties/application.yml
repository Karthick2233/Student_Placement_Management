server:
  port: 8080

spring:
  application:
    name: student-placement-management
  profiles:
    active: dev            # dev = laptop, prod = server (see application-dev.yml / application-prod.yml)
  datasource:
    url: jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:                # connection pool (HikariCP)
      pool-name: PlacementHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:             # file upload limits
      max-file-size: 5MB
      max-request-size: 5MB

management:                # actuator
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,scheduledtasks
  endpoint:
    health:
      show-details: when-authorized

placement:
  jwt:
    expiration-ms: 3600000
  file:
    upload-dir: uploads
    allowed-types: pdf,doc,docx
  scheduler:
    drive-close-cron: "0 0 0 * * *"        
    offer-expiry-cron: "0 5 0 * * *"      
    report-initial-delay-ms: 60000
    report-fixed-delay-ms: 3600000         
